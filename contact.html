<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Veteran Signup - Forge Forward Digital Skills for Veterans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<main>
    <section class="page-header">
        <div class="container">
            <h1>Get Started Today</h1>
            <p>Ready to start your journey? Sign up for our digital skills training program.</p>
        </div>
    </section>

    <section class="contact-content">
        <div class="container">
            <form class="contact-form">
                <div class="form-row">
                    <input type="text" name="firstName" placeholder="First Name" required>
                    <input type="text" name="lastName" placeholder="Last Name" required>
                </div>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="tel" name="phone" placeholder="Phone Number" required>
                <div class="form-group">
                    <label for="veteran-status">Veteran Status</label>
                    <select name="veteran-status" id="veteran-status" required>
                        <option value="">Select your status</option>
                        <option value="veteran">U.S. Military Veteran</option>
                        <option value="active-duty">Currently Active Duty</option>
                        <option value="transitioning">Transitioning Service Member</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="branch">Branch of Service</label>
                    <input type="text" name="branch" id="branch"
                           placeholder="e.g., Army, Navy, Air Force, Marines, Coast Guard" required>
                </div>
                <textarea name="message"
                          placeholder="Tell us about your background, goals, and what you hope to achieve through our program"
                          required rows="4"></textarea>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter" value="yes">
                        I'd like to receive updates about programs and opportunities
                    </label>
                </div>
                <button type="submit">Submit Application</button>
            </form>
        </div>
    </section>
</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
</body>
</html>

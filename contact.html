<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact - Forge Forward Digital Skills for Veterans</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<main>
<section class="page-header">
<div class="container">
<h1>Contact Us</h1>
<p>Get in touch to learn more about our programs or ask questions</p>
</div>
</section>

<section class="contact-content">
<div class="container">
<form class="contact-form">
<div class="form-row">
<input type="text" name="firstName" placeholder="First Name" required>
<input type="text" name="lastName" placeholder="Last Name" required>
</div>
<input type="email" name="email" placeholder="Email Address" required>
<input type="tel" name="phone" placeholder="Phone Number (Optional)">
<div class="form-group">
<label for="interest">I'm interested in:</label>
<select name="interest" id="interest" required>
<option value="">Select your interest</option>
<option value="veteran-programs">Veteran Training Programs</option>
<option value="mentoring">Becoming a Mentor</option>
<option value="partnership">Partnership Opportunities</option>
<option value="donation">Making a Donation</option>
<option value="general">General Information</option>
</select>
</div>
<div class="form-group">
<label for="veteran-status">Veteran Status</label>
<select name="veteran-status" id="veteran-status">
<option value="">Select if applicable</option>
<option value="veteran">U.S. Military Veteran</option>
<option value="active-duty">Currently Active Duty</option>
<option value="transitioning">Transitioning Service Member</option>
<option value="family">Military Family Member</option>
<option value="civilian">Civilian Supporter</option>
</select>
</div>
<textarea name="message" placeholder="Tell us more about your goals, questions, or how we can help you" required rows="4"></textarea>
<div class="form-group">
<label class="checkbox-label">
<input type="checkbox" name="newsletter" value="yes">
I'd like to receive updates about programs and opportunities
</label>
</div>
<button type="submit">Submit Request</button>
</form>
</div>
</section>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>

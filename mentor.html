<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Become a Mentor - Forge Forward Digital Skills for Veterans</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<main>
    <section class="page-header">
        <div class="container">
            <h1>Become a Mentor</h1>
            <p>Join our mission to support veterans transitioning into technology careers. Your expertise and guidance
                can make a lasting impact.</p>
        </div>
    </section>

    <section class="mentor-form-section">
        <div class="container">
            <form id="mentor-form" class="mentor-form">
                <div class="form-row">
                    <input type="text" name="firstName" placeholder="First Name" required>
                    <input type="text" name="lastName" placeholder="Last Name" required>
                </div>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="url" name="linkedin" placeholder="LinkedIn Profile URL (Optional)">
                <input type="tel" name="phone" placeholder="Phone Number (Optional)">
                <input type="text" name="company" placeholder="Current Company/Organization" required>
                <input type="text" name="jobTitle" placeholder="Job Title" required>
                <div class="form-group">
                    <label for="experience">Years of Tech Experience</label>
                    <select name="experience" id="experience" required>
                        <option value="">Select experience level</option>
                        <option value="1-3">1-3 years</option>
                        <option value="4-7">4-7 years</option>
                        <option value="8-15">8-15 years</option>
                        <option value="15+">15+ years</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="skills">Technical Skills (Select all that apply)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="skills" value="html-css"> HTML/CSS</label>
                        <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
                        <label><input type="checkbox" name="skills" value="python"> Python</label>
                        <label><input type="checkbox" name="skills" value="java"> Java</label>
                        <label><input type="checkbox" name="skills" value="react"> React</label>
                        <label><input type="checkbox" name="skills" value="nodejs"> Node.js</label>
                        <label><input type="checkbox" name="skills" value="databases"> Databases</label>
                        <label><input type="checkbox" name="skills" value="cloud"> Cloud Platforms</label>
                        <label><input type="checkbox" name="skills" value="devops"> DevOps</label>
                        <label><input type="checkbox" name="skills" value="mobile"> Mobile Development</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="mentoring-areas">Mentoring Areas (Select all that apply)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="mentoring-areas" value="technical"> Technical Skills</label>
                        <label><input type="checkbox" name="mentoring-areas" value="career"> Career Development</label>
                        <label><input type="checkbox" name="mentoring-areas" value="resume"> Resume Review</label>
                        <label><input type="checkbox" name="mentoring-areas" value="interview"> Interview
                            Preparation</label>
                        <label><input type="checkbox" name="mentoring-areas" value="networking"> Professional Networking</label>
                        <label><input type="checkbox" name="mentoring-areas" value="portfolio"> Portfolio
                            Development</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="availability">Time Commitment</label>
                    <select name="availability" id="availability" required>
                        <option value="">Select availability</option>
                        <option value="1-2">1-2 hours per week</option>
                        <option value="3-4">3-4 hours per week</option>
                        <option value="5-6">5-6 hours per week</option>
                        <option value="flexible">Flexible schedule</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="preferred-time">Preferred Meeting Times</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="preferred-time" value="weekday-morning"> Weekday
                            Mornings</label>
                        <label><input type="checkbox" name="preferred-time" value="weekday-afternoon"> Weekday
                            Afternoons</label>
                        <label><input type="checkbox" name="preferred-time" value="weekday-evening"> Weekday
                            Evenings</label>
                        <label><input type="checkbox" name="preferred-time" value="weekend"> Weekends</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="veteran-connection">Military/Veteran Connection</label>
                    <select name="veteran-connection" id="veteran-connection">
                        <option value="">Select if applicable</option>
                        <option value="veteran">I am a veteran</option>
                        <option value="active-duty">Currently active duty</option>
                        <option value="military-family">Military family member</option>
                        <option value="civilian">Civilian supporter</option>
                    </select>
                </div>
                <textarea name="motivation"
                          placeholder="Why do you want to mentor veterans? What unique perspective or experience can you offer?"
                          required></textarea>
                <textarea name="additional-info"
                          placeholder="Additional information, special skills, or questions (Optional)"></textarea>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="agreement" required>
                        I agree to commit to mentoring for at least 3 months and understand the responsibilities
                        involved.
                    </label>
                </div>
                <button type="submit">Submit Mentor Application</button>
            </form>
        </div>
    </section>
</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/chatbot.js"></script>
</body>
</html>
